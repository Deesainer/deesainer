[package]
name = "deesainer-plugins"
description = "Deesainer L4: sandboxed WebAssembly plugins (wasmi) with fuel and memory limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Loop dispatch: the tail-call dispatch of optimised builds overflows the
# stack on Windows.
wasmi = { version = "2", features = ["portable-dispatch"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
