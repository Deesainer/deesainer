# Temporary bisect workflow: which plugin test crashes on Windows? Delete once
# the Windows CI is green again.
name: windows-plugin-debug

on: [push]

jobs:
  plugin:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: grid plugin test
        run: cargo test -p deesainer-engine --test plugin grid_plugin_draws_twelve_cards_in_one_undo_step -- --nocapture
      - name: recursion guard test
        run: cargo test -p deesainer-engine --test plugin plugins_cannot_recurse_or_escape -- --nocapture
